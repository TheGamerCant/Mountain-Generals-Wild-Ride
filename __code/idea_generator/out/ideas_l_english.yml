l_english:

 SLO_new_slovak_state_idea_0: "The New Slovak State"
 SLO_new_slovak_state_idea_0_desc: "The birth of the new Slovak state shall go down as one of the greatest achievements of the twentieth century. We have placed the power of state not in the hands of the old stagnant elites or the unwashed masses, but in men of action and men of iron. Where democracies die of stagnation and decadence and totalitarian regimes of hubris, we shall set forth a new approach."
