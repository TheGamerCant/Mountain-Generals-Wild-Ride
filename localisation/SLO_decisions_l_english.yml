 SLO_ger_tolerance_decision:0 "Current Reich Tolerance: [GetGermanToleranceColour]"
 SLO_ger_tolerance_decision_desc:0 "[GER.GetNameDefCap] is willing to tolerate some level of independence and deviation from the nations of Central and Eastern Europe, but such 'generosity' is not an infinite resource. If our policies are not sufficiently aligned with that of [GER.GetNameDef], serious consequences may arise."
 SLO_reich_tolerance_good:0 "§G[?current_bop_val|2]§!/§Y[?SLO.SLO_bop_ger_tolerance|2]§!"
 SLO_reich_tolerance_bad:0 "§R[?current_bop_val|2]§!/§Y[?SLO.SLO_bop_ger_tolerance|2]§!"
 SLO_german_intervention_in_our_politics:0 "Germany Intervenes"
 SLO_german_intervention_in_our_politics_desc:0 "Berlin have made it clear to us their displeasure with our policies. We might want to realign ourselves closer to them, lest we seek the consequences."
 SLO_german_intervention_in_our_politics_cancel_trigger_tt:0 "The §YBalance of Power§! is less than §Y[?SLO.SLO_bop_ger_tolerance|2]§!\n\nCurrent value: §Y[?SLO.power_balance_value|%]§!"
 
 SLO_povazska_bystrica_arms_factory:0 "Expand the Zbrojovka Považská Bystrica Arms Factory"
 SLO_povazska_bystrica_arms_factory_desc:0 "The Zbrojovka Považská Bystrica branch is one of Slovaia's most productive factories, and German companies have been looking to invest and refit it's machines to produce arms for the German Army."
 SLO_povazska_bystrica_arms_factory_tt:0 "$SLO_modify_the_slovak_economy_by$$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+5.00%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$: §G+5.00%§!"
 SLO_slovenske_rudohorie_iron_ore_processing:0 "Slovenské Rudohorie Iron Ore Processing Plant"
 SLO_slovenske_rudohorie_iron_ore_processing_desc:0 "Eastern Slovakia is home to significant deposits of iron ore and other valuable minerals, expanding it with German help will boost the local economy while providing Germany with a steady supply of materials."
 SLO_slovenske_rudohorie_iron_ore_processing_tt:0 "$SLO_modify_the_slovak_economy_by$$MODIFIER_LOCAL_RESOURCES_FACTOR$: §G+9.00%§!\n$MODIFIER_MIN_EXPORT_FACTOR$: §Y+5%§!"
 SLO_convert_appolo_oil_refinery_for_synthetic_materiels:0 "Convert the Apollo Oil Refinery for Synthetic Materiels"
 SLO_convert_appolo_oil_refinery_for_synthetic_materiels_desc:0 "The Germans have made significant breakthroughs in the chemical synthesisation of rubber and other materiels. We should put the Apollo oil refinery to use in the production of this new technology."
 SLO_convert_appolo_oil_refinery_for_synthetic_materiels_no_synth_experiments_tt:0 "We will gain two §YSynthetic Refineries§! and a §YFuel Silo§! in a random state."
 SLO_convert_appolo_oil_refinery_for_synthetic_materiels_tt:0 "$SLO_modify_the_slovak_economy_by$$modifier_production_speed_synthetic_refinery_factor$: §G+12.00%§!"
 SLO_military_exersizes_with_germany:0 "Military Exercises With [GER.GetNameDef]"
 SLO_military_exersizes_with_germany_desc:0 "Many call Mountain General's Slovakia the Prussia of Eastern Europe. Yes they do! Shut up!\n\nAnyways, German high command has taken an interest in joint exercises, helping to refine both of our nation's military tactics."
 SLO_military_technological_exchanges_with_germany:0 "Military-Technological Exchange With Germany"
 SLO_military_technological_exchanges_with_germany_desc:0 "We have much to learn from Germany, and they still need third countries to bypass the arms restrictions of Versailles. We can help each other out in this regard."
 SLO_request_german_generals_and_advisors:0 "Request German Generals and Advisors"
 SLO_request_german_generals_and_advisors_desc:0 "The common Slovak soldier has proven their ferocity and iron will during our war effort, proving themselves valiantly wherever the Slovak flag flies. Integrating ourselves further into the German high command structure will only improve our combat capabilities."
 SLO_sign_unequal_treaties_with_germany:0 "Sign Economic Treaties With Germany"
 SLO_sign_unequal_treaties_with_germany_desc:0 "The Germans are currently unhappy with the current trade arrangements between our two nations, believing that they do not get good value for their investments. They have given us a series of demands they would like to see met, meeting some of them could allow us some space to breathe, at least temporarily."
 SLO_renegotiate_unequal_treaties_with_germany:0 "Renegotiate Economic Treaties With Germany"
 SLO_renegotiate_unequal_treaties_with_germany_desc:0 "Our trade relationship with [GER.GetNameDef] has seen our industries slowly bend to the will of Berlin. As a reward for being such a good ally, we should seek to get some level of respite from these terms."
 SLO_renegotiate_unequal_treaties_with_germany_trigger_tt:0 "Has national spirit §Y$SLO_unfair_trade_with_germany_idea_1$§!"
 SLO_form_the_rychla_division:0 "Form the Rýchla Division"
 SLO_form_the_rychla_division_desc:0 "With our newfound expertise and equipment from our friends in Berlin, we are able to form a motorised division to assist with the war effort."
 SLO_get_rid_of_german_appointees:0 "Fire German Appointees"
 SLO_get_rid_of_german_appointees_desc:0 "Previously, the Germans bent our elbows behind our  backs and forced us to appoint several pro-Germans to our government. These men have outlived their usefulness"
 SLO_get_rid_of_german_appointees_trigger_tt:0 "Any Character:\n    Has been appointed by Germany"