l_english:
 slovakia.1.title:0 "Mountain General Demands Peace"
 slovakia.1.desc:0 "After months of heavy fighting, the bastard Mountain General has somehow taken control of most of Slovakia! He has demanded our recognition of his conquests, or else, he threatens, he will just as easily march into Prague!"
 slovakia.1.a:0 "We have no choice..."
 
 slovakia.2.title:0 "Prague Agrees to our Demands"
 slovakia.2.desc:0 "Shock. Disbelief. Anger.\n\nThese were but some of the feelings felt by those in Prague today, as one mysterious man undid the nation-building project they had been working on for decades. Defeated, tired, and hunched over a singular piece of paper placed in front of them at the table, they begrudgingly agreed to every, single, one, of Mountain General's demands. Czechoslovakia was to be no more, and there was nothing they could do about it.\n\nAcross the table, a masked man with yellow teeth grinned, and thought to himself..."
 slovakia.2.a:0 "This is where the fun begins"
 
 slovakia.3.title:0 "Slovak Soldiers Defect to our Cause"
 slovakia.3.desc:0 "In face of our overwhelming victories and [SLO.GetLeader]'s brilliant genius, thousands of our Slovak brethren have refused their orders from Prague and have mutinied to our cause!"
 slovakia.3.a:0 "Our victory is inevitable."
 
 slovakia.4.title:0 "What IS Mountain Generalism?"
 slovakia.4.desc:0 "Mountain General was approached in his Bratislava office by Josef Tiso.\n\n'My leader, you have taken all of Slovakia to never before seen heights, but there is one pressing matter - ideology.'\n\nMountain General snapped back - 'What about ideology!'\n\n'So far all you've said in terms of your ideological standing is repeatedly calling Hungary 'gay' and 'cringe', and while undoubtedly true, one cannot lead a state on just these beliefs alone.'\n\nMountain General cooled down and responded to Tiso - 'Perhaps is is time to hammer out this whole ideology thing. We have already made great progress at attaining statehood, we now need a vision to guide us.'"
 slovakia.4.a:0 "Send out invitations to Slovakia's top minds at once"
 
 slovakia.5.title:0 "The Conference Begins"
 slovakia.5.desc:0 "At the request of Mountain General, many of Slovakia's top minds have assembled in a hall in Bratislava. Scientists, old Czechoslovak politicians and military officials have all assembled for this night of most importance.\n\nKicking off the event with a rousing speech, Mountain General laid forth his plans for Slovakia."
 slovakia.5.a:0 "We must make Slovakia great by destroying our Hungarian enemies!"
 slovakia.5.b:0 "Slovakia is to be a shining city upon a hill, for all of Europe to see!"
 slovakia.5.c:0 "Stability and security must come first"
 slovakia.5.d:0 "The working people of Slovakia and Europe have suffered too much!"
 
 slovakia.6.title:0 "Bratislava nights"
 slovakia.6.desc:0 "Josef Tiso couldn't sleep. He had been lying awake for hours, trying to force himself to go to sleep, but Mountain General's recent erratic behaviour caused him great distress.\n\n'It's fine,' he thought to himself, 'He knows more than we ever could'. Unable to get to sleep, he took himself for a walk.\n\nWhile walking the streets of Bratislava, Tiso came across Mountain General, intoxicated and pissing in the river.\n\n'What are you doing,' he enquired.\n\n'Pissing in the Danube so it flows down to Budapest,' Mountain General responded.\n\n'Genius - but anyways, why are you also up?'\n\n'You see, I forgot to take my crazy pills yesterday, and as such I have been beside myself and extremely energetic.'"
 slovakia.6.a:0 "'Perhaps I should take them.'"
 slovakia.6.b:0 "'And I like it!'"
 SLO_mg_goes_crazy_tt:0 "§RMountain General grows madder...§!"
 
 slovakia.7.title:0 "Matters of Foreign Policy"
 slovakia.7.desc:0 "Another day at the conference, another day of heated debate. Today's debate primarily focused on foreign policy and Slovakia's place in the world.\n\nOne camp believes that with our great leader Mountain General at the helm, we will be undefeatable! Our enemies will tremble before the forces of the Slovakian Napoleon!\n\nThe other camp, however, believes that diplomacy is key to success - that Slovakia can position herself into a key role in this new Europe, as a beacon for all peoples, and as the leader of a new world order that puts common people first.\n\nAs per usual, the decision ultimately falls into Mountain General's hands..."
 slovakia.7.a:0 "Slovakia will forge her own path in the world, lesser nations be damned!"
 slovakia.7.b:0 "Friendship with other peoples benefits all of us."
 
 slovakia.8.title:0 "The Powers of Government"
 slovakia.8.desc:0 "With the conference carrying on in full swing, questions have arisen about the powers of our government, and what the best system is for guaranteeing Slovakia's continued independence and prosperity.\n\nThere were of course the usual debates about a liberal democracy versus a stronger style of governance, but a new unusual faction has emerged. Calling themselves the "Make Slovakia Great Again" movement, they advocate for total powers to Mountain General, worship of Mountain General in schools, as well as building a wall on our southern border and making Hungary pay for it."
 slovakia.8.a:0 "True power comes from the people."
 slovakia.8.b:0 "We need a strong and powerful government to steer this ship."
 slovakia.8.c:0 "Fuck everyone else! Mountain General is a God among men!"
 
 slovakia.9.title:0 "Matters of Economic Policy"
 slovakia.9.desc:0 "The conference today was more heated than usual - and for good reason. Today's debates were primarily focused on the economy, many viewing it as the most important factor in the long-term success of our Slovak state. Debates today ranged from all across the ideological spectrum.\n\nThe first major faction called for a largely free - if slightly regulated - market, believing that allowing the complex machinations of a modern economy to be run by businessmen and individuals with little government interference was the best approach to secure Slovakia's economic prosperity in our increasingly global world.\n\nAnother group praised the government interventionist economics of Italy, believing that Corporatist collaboration between the state, businessmen and the lower classes created stability and prosperity. Of this group, there were many members that also called for radical autarky such as that of Adolf Hitler's regime, believing that Slovakia should be largely self-sufficient to guarantee stability among tumultuous times.\n\nThere were finally Marxists, whom argued in favour of transferring the means of production to the workers and strengthening trade unions, as they view this as the only way to guarantee the prosperity and happiness of the lower classes.\n\nAt the end of the day, Mountain General spoke..."
 slovakia.9.a:0 "The free market is the only truly sustainable economy."
 slovakia.9.b:0 "The government must ensure the stability and well being of it's people."
 slovakia.9.c:0 "We cannot allow our economy to be reliant on foreign powers."
 slovakia.9.d:0 "The means of production belong to those who work them."
 
 slovakia.10.title:0 "The Final Day of the Conference"
 slovakia.10.desc:0 "On the final day of the Slovak national congress, all attendees gathered in Bratislava to await Mountain General's announcements. The past weeks had been devoted to determining the best policies and path to go down to lead our country in these trying times.\n\nMountain General took the stage to announce his decision."
 slovakia.10.a:0 "Slovakia holds it's breath..."
 
 slovakia.11.title:0 "The Triumph of Mountain Generalism"
 slovakia.11.desc:0 "Shock and horror reverberated across the room. The attendants fell silent, to the point you could hear a pin drop. This silence, however, wasn't to last.\n\nSoldiers began to storm the room, selecting people seemingly at random to drag from their chairs and out of the room. One by one, the other attendees rose to their feet and started chanting, at the top of their lungs:"
 slovakia.11.a:0 "Sláva Horskému Generálovi!"
 
 slovakia.12.title:0 "The Triumph of Fascism"
 slovakia.12.desc:0 "After many weeks of debating, our path forward is obvious. For Slovakia to truly prosper in the tumultuous times, we need complete national unity and strength. We must expand our borders, enforce traditional values and instil patriotism into all of our citizens, lest Slovakia be relegated to the dustbins of history alongside lesser nations."
 slovakia.12.a:0 "We will make Slovakia great!"
 
 slovakia.13.title:0 "Walking the Path of Despotism"
 slovakia.13.desc:0 "It was unsurprising, really. With such a great leader, and with such trying times, how could we pick anyone else?\n\nFor now, the current despotic clique surrounding Mountain General holds on. All that remains to be seen is for how long..."
 slovakia.13.a:0 "We will make Slovakia great!"
 
 slovakia.14.title:0 "The Triumph of Democracy"
 slovakia.14.desc:0 "With the conference coming to an end, there was no speculation as to what came next. Mountain General took the stand and began to announce a long list of democratic reforms and ideals to live up to. His speech was broadcast for all of Slovakia and the world, for Slovakia was to succeed where other nations failed, and truly be a shining city upon a hill."
 slovakia.14.a:0 "I love democracy."
 
 slovakia.15.title:0 "The Triumph of Stalinism"
 slovakia.15.desc:0 "As Mountain General took the stands to announce his intention for the workers' state, few could have predicted what came next. Soldiers loyal to Mountain General stormed the hall, grabbing the now enemies of the state from their chairs. Mountain General announced his intention to cleanse Slovakia of reactionaries and establish vanguard party rule, as to see his glorious vision of Slovakia through without interruption."
 slovakia.15.a:0 "There will be no quarter for the reactionaries!"
 
 slovakia.16.title:0 "The Triumph of Anarchism"
 slovakia.16.desc:0 "As chatter dimmed, all eyes pivoted to the stage. Mountain General had walked up to the podium wearing all black. He announded the reorganisation of Slovakia into a "Free Territory", and the abolition of the centraliised state. They were to free the working man from the shackles of oppression and spread their liberation to all of Europe!"
 slovakia.16.a:0 "Anarchia mama, za nas!"
 
 slovakia.17.title:0 "The Triumph of Socialism"
 slovakia.17.desc:0 "Moutain General took the stage after weeks of debating, ready to announce the future of the country. In his speech, he announced the introduction of Democratic Socialism to Slovakia. Slovakia was to be a worker's paradise, a shining light for all the oppressed of the world. Slovakia was not to make the mistakes of prior Communist and Socialist movements!"
 slovakia.17.a:0 "Been spendin' most our lives, livin' in a workers' paradise."
 
 slovakia.18.title:0 "Mountain General denounces Hungary"
 slovakia.18.desc:0 "'...and we must root out the Hungarian sympathisers among us. Those who claim that we should treat the southern curs with empathy either do not understand the true gravity of the situation, or are outright aiding the enemy! They speak of their so called 'human rights', but how can one reasonably argue that those inbred, Mongolian heathens, even qualify as such! We must deal to the Hungarian race a killing blow, so that...'\n\nMountain General rambled on for hours. His words captivated many Slovaks, but needless to say, the Hungarians didn't much like them."
 slovakia.18.a:0 "Glory to Slovakia! Glory  to Mountain General! Death to Hungary!"

 slovakia.19.title:0 "Mountain General denounces Germany"
 slovakia.19.desc:0 "'...They claim to be 'Aryans', and yet their people hold no resemblance to the true Aryans. The true Aryans migrated a millennia ago from the European steppes, and are today known as the Slavs! Never forget this my fellow Slovaks, that it is we, the descendents of the first peoples, who are the true Aryans!'"
 slovakia.19.a:0 "Glory to Slovakia! Glory to Mountain General! Death to the false Aryans!"
 
 slovakia.20.title:0 "Economic Downturn"
 slovakia.20.desc:0 "Following our rapid victory in our war of independence, we now have the massive task of establishing a functioning Slovak state with a competent and efficient bureaucracy.\n\nWe have taken over many former Czechoslovak ministries, construction sites and army barracks, as well as many old arms factories, giving us a solid base to grow our arms industry. Despite that however, transforming and stabilising the country will take time, time that we might not have..."
 slovakia.20.a:0 "We must fix this at once!"
 slovakia.20.tt:0 "$SLO_modify_the_slovak_economy_by$$MODIFIER_POLITICAL_POWER_COST$: §R+0.25§!\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §Y+20.0%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §R-15.00%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$: §R-15.00%§!\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$: §R-10.00%§!"
 
 slovakia.21.title:0 "The Death of Andrej Hlinka"
 slovakia.21.desc:0 "Co-founder and chairman of the far-right Slovak People's Party, Andrej Hlinka has died at the age of 78.\n\nA priest his whole life, he devoted his time to service to God and Slovakia, and was a committed nationalist and supporter of Slovak independence form both Hungary and Czechoslovakia. He leaves behind a complicated legacy as leader of such a controversial but influential party, and it seems that for as many who come out to mourn him, there are just as many who come out to celebrate."
 slovakia.21.a:0 "We will carry on his legacy."
 slovakia.21.b:0 "Rest in Piss, Fascist."
 
 slovakia.22.title:0 "Dinner Time"
 slovakia.22.desc:0 "It was a normal Bratislava night for the Holičes. They were eating dinner together in the dining room, when all of a sudden, their son, Tomáš, had something to announce.\n\n'Mama, Papa, look what we learnt in school today'. Tomáš pulled a Balaclava out of his pocket, before donning it at the table. 'Death to the Hungarians, glory to Mountain General! Don't I look Mountaineer as fuck? I got that Slovak-Záhorie ethnicity in me.'\n'That's great sweetie' Helena responded, refraining from looking up from her plate. Her husband, Petr, was not so reserved.\n\n'Take that fucking mask off NOW!' he bellowed. Tomáš was taken back. 'NOW!' His fist slammed the table in rage. Tomáš took off the Balaclava, whimpering like a scared dog.\n'You can play dictator at school all you like, but in this household, I will NOT tolerate that bastard!'"
 slovakia.22.a:0 "The only thing you could hear after that was the chewing of food."

 slovakia.23.title:0 "3AM"
 slovakia.23.desc:0 "It was another sleepless night for Helena. Although the incident was over a week ago, you always had to show a little bit of caution, which was something Petr had not done.\n'It's fine', she thought to herself, 'no-one cares.'\n\nKNOCK KNOCK\n\nShe woke up Petr, and together they ventured down the stairs, before opening the door. It was a man from the Mountain General Guards.\n'Mr and Mrs Holič, you are under arrest for anti-[SLO.GetLeader] behaviour.'\n\nPetr was drunk as usual. He didn't seem to mind, let alone know, about the gravity of the situation. Helena was the opposite. She knew full well what was to happen, yet know there was nothing she could do about it. Then, down the stairs, came Tomáš.\n'Oh Tomáš, please go back upstairs' Helena pleaded, but it was no use. Tomáš walked to the door and looked down Helena in the eyes.\n\n'Death to the Hungarians, glory to Mountain General!'"
 slovakia.23.a:0 "Knowing he was no longer her son, she accepted whatever came next."
 
 slovakia.24.title:0 "The Slovak Army"
 slovakia.24.desc:0 "The Slovak army is in a bit of a sorry state. As the lesser of two supposed equals, we were always second in line, but no more! Under Mountain General, our army will be modernised, expanded, and we will become one of the most feared armies in Europe!"
 slovakia.24.a:0 "Let's get to work"
 
 slovakia.25.title:0 "Ethnic Violence in Southern Slovakia"
 slovakia.25.desc:0 "As a result of our new anti-Hungarian racial laws, violence and chaos has erupted in southern Slovakia. There have been large scale protests in many cities by their local Hungarian populations, and even more disatrous, some of the more radical Slovaks claim we are being too soft on the Hungarians, and have 'taken matters into their own hands'. These men have formed improvised militias, and have initiated pogrom-like cleansings against the Hungarians of the regions."
 slovakia.25.a:0 "I fail to see why this is a bad thing..."
 
 slovakia.26.title:0 "Hungarian Assets Seized"
 slovakia.26.desc:0 "Following our expulsion of Hungarians from Southern Slovakia and Ruthenia, we seized their assets as compensation for the HUNDREDS of years of injustice they have done to us. We will put these assets to good use."
 slovakia.26.a:0 "The first step of many in dealing with the Hungolian menace"
 slovakia.26.tt:0 "$SLO_modify_the_slovak_economy_by$$MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-3.0%§!"
 
 slovakia.27.title:0 "Partisan Uprisings"
 slovakia.27.desc:0 "Foolishly opposing our new regime, partisans loyal to 'democracy' and 'freedom' have taken it upon themselves to resist our new government's efforts to make Slovakia great. Their methods, though crude and insufficent to topple our government, are still a headache that must be dealt with at once before we can focus on more important matters."
 slovakia.27.a:0 "Surely they cannot think they will beat Mountain General?"
 slovakia.27.tt:0 "Completing the focus §Y$SLO_trust_in_mountain_general$§! will prevent any more partisan uprisings."
 
 slovakia.28.title:0 "[SLO.GetLeader] Demands Our Subjugation!"
 slovakia.28.desc:0 "Apparently dissatisfied with humiliating us only once, [SLO.GetLeader] has now demanded our subjugation at threat of war."
 slovakia.28.a:0 "We have no choice but to give in..."
 slovakia.28.b:0 "We will fight that madman here and now!"
 
 slovakia.29.title:0 "[CZE.GetName] Yields"
 slovakia.29.desc:0 "Cowering before our might, Prague has yielded to our demands. Yet another incredible victory for [SLO.GetLeader], he quickly took to the radio to announce the news to the world as Slovak soldiers crossed the border that once stood between our two nations."
 slovakia.29.a:0 "Welcome home brothers!"

 slovakia.30.title:0 "[CZE.GetName] Refuses"
 slovakia.30.desc:0 "Blinded by delusions of their strength and underestimating [SLO.GetLeader]'s brilliance, those pesky Czechs have refused our peaceful attempts at annexing and subjugating them! [SLO.GetLeader] has ordered [SLO.GetLeader.GetHerHis] armies to march to the Czech border and prepare for an assault."
 slovakia.30.a:0 "So be it"
 
 slovakia.31.title:0 "Integration of Czech Škoda"
 slovakia.31.desc:0 "Following the reunification of Slovakia and Czechia, we have taken over many of the Škoda factories, improving our knowledge and integrating our arms industries. Hopefully, we will be able to return back to the arms exporting giant we once were, and Mountain General has ordered for a swift and effective integration of our arms industries."
 slovakia.31.a:0 "Great news!"
 
 slovakia.32.title:0 "Arms Exports Rise"
 slovakia.32.desc:0 "With the integration of the Czech and Slovak arms industries once more, our arms export orders have risen greatly. This has given us a new source of knowledge, influence and revenue."
 slovakia.32.a:0 "Ura!"
 
 slovakia.33.title:0 "Political Violence on the Streets"
 slovakia.33.desc:0 "Horror struck Slovakia today as peaceful demonstrations turned violent, with far-left and far-right groups clashing on the streets. Fortunately no-one died, however several dozen had to be rushed to a nearby hospital. The people of Slovakia look for guidance from their government, and hope that this will not repeat."
 slovakia.33.a:0 "We must condemn this savagery"
 slovakia.33.b:0 "Pin the blame on the leftists"
 
 slovakia.34.title:0 "The Situation in Poland"
 slovakia.34.desc:0 "After Józef Piłsudski's death in May of 1935, Ignacy Mościcki's centrist authoritarian clique has succeeded in their consolidation of power in the country. However, the situation is not as stable for Mościcki as it may seem from the outside, with right and left factions within the ruling party often chafing for power. In order to put Poland on the path to democracy once more, we will seek to ally with the Sanation left faction, and help them take over the Polish government."
 slovakia.34.a:0 "Let's find somewhere nice to meet, shall we?"

 slovakia.35.title:0 "Preparations"
 slovakia.35.desc:0 "Following our contact with members of the Polish Sanation Left, Mountain General has agreed to supply them intelligence and arms to prepare a coup against the ruling centrist clique."
 slovakia.35.a:0 "No price is too great for democracy"

 slovakia.36.title:0 "The Price of Democracy"
 slovakia.36.desc:0 "Under the cover of night-time on [?global.date.GetDateStringNoHourLong], undercover Slovakian soldiers smuggled thousands of arms across the Polish border. Bribes were given to indifferent officials and the Sanation left stands ready to overthrow [POL.GetLeader], eagerly waiting for Walery Sławek's word to do so."
 slovakia.36.a:0 "Poland will be free once more!"

 slovakia.37.title:0 "The Coup Succeeds!"
 slovakia.37.desc:0 "Earlier today, soldiers loyal to Sławek stormed Warsaw and arrested Ignacy Mościcki. After a couple of hours and minor skirmishes, it would seem as though Walery Sławek has succeeded in his efforts to consolidate power in Poland around the Sanation left"
 slovakia.37.a:0 "We'll take any ally we can get"

 slovakia.38.title:0 "[SLO.GetLeader] Requests an Alliance"
 slovakia.38.desc:0 "Ayo wanna kick Hitler's teeth in? Why they hell are you reading this? This is the fucking Slovakia mod."
 slovakia.38.a:0 "We must stand united against Fascism"
 slovakia.38.b:0 "Who does this madman think he is"

 slovakia.39.title:0 "[FROM.GetLeader] Agrees to an Alliance"
 slovakia.39.desc:0 "[FROM.GetLeader] has agreed to our request for an alliance against Germany. It seems the democracies of Europe are finally waking up and are ready to put the mad man of Berlin in his place."
 slovakia.39.a:0 "Great news"
 
 slovakia.40.title:0 "[FROM.GetLeader] Refuses an Alliance"
 slovakia.40.desc:0 "[FROM.GetLeader] has refused to help form an alliance against Germany, arguing it to be 'provocative'. This leaves us weakened, and European democracy in a vulnerable position."
 slovakia.40.a:0 "Oh well"
 
 slovakia.41.title:0 "The New Sunrise in [?43.GetCapitalVictoryPointName]"
 slovakia.41.desc:0 "It had been many eventful years since the start of the Slovakification campaigns in the former Hungary. For the most part it was a smashing success, but there was always resistance. Well, no more.\n\nThe latest rounds of deportations eliminated anyone who might have had some sympathies to Hungarian 'culture'. Now, the people spoke Slovak, worked in Škoda factories, and were indistinguishable from any other aryan Slovak. For many, Hungary was a word they had forgotten, and they had most certainly forgotten the feeling of it. Mountain General walked down a cobble road in the city bearing his name, knowing that he saved the Slovak people, and perhaps the world as a whole, from the demonic entity once known as Hungary."
 slovakia.41.a:0 "A smile on his face, he shed a single tear"
 
 slovakia.42.title:0 "Explanation of the Democratic Mechanics"
 slovakia.42.desc:0 "Okay so this path has some complicated mechanics that you should be aware of.\n\nFirst of all is the election minigame. You need to boost your party's support via campaigning to maximise your party's seat count. The party popularity boosts from the campaign events are multiplicative. The means that the best way to win is to focus on states with a high seat count, high support for your party and other parties slightly above the threshold. If you pick a threshold of five percent and another party is at 5.5% in a state for example, campaigning there might knock them below the threshold, netting you (and other large parties) even more seats.\n\nThen once a government is formed, they will start working on focuses. The government will try to alternate between economic and political focuses, and prioritise research slots, factories and the 'Promotion of Slovak Nationalism' path. As a player, you can pick a focus to work on once every 420 days, although you will lose 100 political power if you complete it instead of the AI. The effects of some of the focuses may change depending on the composition of the government, but not by much."
 slovakia.42.a:0 "Got it"
 slovakia.42.b:0 "Seems needlessly complicated"
 
 slovakia.43.title:0 "Mountain General's Fireside Chat"
 slovakia.43.desc:0 "With the successful rollout of our civilian radio program, hundreds of thousands of Slovaks now have access to the pinnacle of modern technology, a testament to the abilities of our new state under the wise leadership of Mountain General. To encourage frequent listening and pride in the regime, Mountain General has started a weekly radio program inspired by Franklin Roosevelt's so-called 'Fireside Chats'. Given his claim of being a major media personality from the future, he should have no issue inspiring confidence and awe with his words."
 slovakia.43.a:0 "A testament to our leader's greatness"
 
 slovakia.44.title:0 "Ramblings of a Madman"
 slovakia.44.desc:0 "It was a quiet evening just like any other. Hundreds of thousands of Slovak families turned on their radios to listen to Mountain General's fireside chat when disaster struck.\n\n"THESE FUCKING HUNGOLIANS, PIZDEEEeeeEETSS, THEY THINK THEY KNOW EVERYTHING, THEY THIiiiII..."\n\nThe entire nation stood silent for a few seconds. Mountain General was clearly drunk, rambling his brains out about God knows what. How were they to go on? How could they talk about this without being reported by some eager informant, sniffing for a promotion?\n\nThe next day, and the day after, and the day after, Slovakia was on edge. You could hear a needle, or perhaps a dead body, drop."
 slovakia.44.a:0 "Have anyone who mentions this shot!"
 
 slovakia.45.title:0 "Year Zero"
 slovakia.45.desc:0 "Mountain General watched over Bratislava from his balcony. It was late at night, and after a long day of ensuring Slovakia's basedness, he liked to relax by getting some fresh air, and observing his loyal citizens.\n\nAfter several months of tough manoeuvring and the administration of bullets to many skulls, the status of the new regime was secure. On this fine Slovak evening, he pondered how to celebrate such a momentous achievement. It was then that a brilliant idea sprung into his head, as one often does.\n\n"The old Gregorian Shmegshmorian calendar is a symbol of Hungolian degeneracy!" Mountain General thundered the following morning, "It cannot represent the new Slovak state and people. What we need is a new system, tied to our glorious regime."\n\n"Henceforth, just as the Gregorian starts with Christ and the Hijri with Muhammed's travels, ours shall start with ME!""
 slovakia.45.a:0 "What?"
 
 slovakia.46.title:0 "Hungary Launches An Offensive Into [73.GetName]"
 slovakia.46.desc:0 "With the nascent Slovak State still rebuilding, [HUN.GetLeader] has launched a surprise attack against our forces in [?SLO.border_war_state.GetName], aiming to take the territory before we can react."
 slovakia.46.a:0 "Ah!"
 
 slovakia.47.title:0 "Victory in [?SLO.border_war_state.GetName]"
 slovakia.47.desc:0 "Despite their best efforts, the Hungarian dogs have been pushed back from their initial advances into [?SLO.border_war_state.GetName], battered and bruised. Our brave Slovak boys successfully defended their positions against the Hungarians, showing the world the strength of the [SLO.GetNameDef]!"
 slovakia.47.a:0 "Ura!"
 
 slovakia.48.title:0 "Defeat in [?SLO.border_war_state.GetName]"
 slovakia.48.desc:0 "Caught on the back foot, our troops have been forced to retreat from their positions in [?SLO.border_war_state.GetName], paving way for Hungary to advance into the region and declare it part of [HUN.GetNameDef]."
 slovakia.48.a:0 "How could this have happened?"
 
 slovakia.51.title:0 "Unease in the Military"
 slovakia.51.desc:0 "With the consolidation of power around Mountain General and his clique, various democratically-minded officers, generals and ordinary soldiers are plotting against Mountain General. Reports indicate massive discontent with our regime, weakening any ability for us to respond to the various vultures circling the new Slovak state."
 slovakia.51.a:0 "We must deal with these traitors at once!"
 
 slovakia.52.title:0 "Encroaching German Influence"
 slovakia.52.desc:0 "There's an old saying in geopolitics - the strong do what they want, and the weak do what they must.\n\nOur hostile relations with our neighbours has lead many of the more radical members of our government to seek increased co-operation with the regime of [GER.GetLeader], positioning ourselves as a loyal ally of the Reich in exchange for protection. Of course, Mountain General is more reluctant to welcome Hitler to Bratislava with such welcome arms, but politics being what they may, we will have to deal with Germany at some point."
 slovakia.52.a:0 "Why can't we have Sweden or Canada for a neighbour?"
 slovakia.52.b:0 "Some co-operation is in both our nations' interests"
 
 slovakia.53.title:0 "Hungary Launches An Offensive Into [664.GetName]"
 slovakia.53.desc:0 "After their seizure of [73.GetName], many feared that a Hungarian strike against Southern Slovakia was only a matter of time. Today, that has been proven right.\n\nHungarian troops have begin shelling positions around Košice, Lučenec and Komárno, hoping to seize the southern strip of Slovakia."
 slovakia.53.a:0 "We cannot afford to lose again!"
 
 slovakia.54.title:0 "Fate of the Democratic Officers"
 slovakia.54.desc:0 "Following a thorough shakedown in the military, we have apprehended and placed in custody several generals and officers whom we suspect harbour loyalties to the old regime. Such filth and traitorous nonsense has no place in the new Slovakia, but there remains some debate about what to do with them.\n\nOne the one hand, executing them would send a clear message about just how far we are willing to go to root out traitors to Mountain General, however doing so might also cause more even discontent in the army, as other officers fear they may be next. After all, when the penalty for harbouring such thoughts and acting on them is the same, why wouldn't rebellious officers take their chances?"
 slovakia.54.a:0 "Take no chances - execute them"
 slovakia.54.b:0 "Imprison them, they may come in useful"
 
 slovakia.55.title:0 "Germany Agrees to Send Advisors"
 slovakia.55.desc:0 "Following our request to further integrate German officers into our army, Germany has agreed to send several generals and advisors to help assist us in our joint war efforts."
 slovakia.55.a:0 "Excellent"
 
 slovakia.56.title:0 "Slovakia Requests German Generals and Advisors"
 slovakia.56.desc:0 "Why are you playing Germany in the funni Slovakia mod?"
 slovakia.56.a:0 "Okay"
 
 slovakia.57.title:0 "Growing Influence of the Reich"
 slovakia.57.desc:0 "With increased investments and our economy and our army growing ever more dependant on German weapons and training, the claws of the Reich have begun seriously penetrating their way into the day-to-day operations of the Slovak government. Many decisions require de-factor approval from Berlin before anything can be done, and Mountain General's 'rule' of the country seems ever more unstable."
 slovakia.57.a:0 "I think we knew this would happen..."
 
 slovakia.58.title:0 "[GER.GetNameDefCap] Demands the Appointment of [?SLO.political_advisor_selected_loc.GetName]"
 slovakia.58.desc:0 "A telegram from Berlin has arrived at Mountain General's desk, "suggesting" the appointment of [?SLO.political_advisor_selected_loc.GetName] to a higher position in cabinet. Although nominally just a recommendation due to his "excellent performance and high degree of competency", it is little more than a thinly-veiled demand that we increase the power and influence of factions deemed loyal to Berlin within our government. Refusal to agree to such demands will not go unnoticed by the Germans, however."
 slovakia.58.a:0 "It is a reasonable request"
 slovakia.58.b:0 "These decisions will be made in Bratislava and Bratislava alone"
 
 slovakia.59.title:0 "[GER.GetNameDefCap] Demands the Appointment of [?SLO.high_command_selected_loc.GetName]"
 slovakia.59.desc_war:0 "With the war raging in the east, an attaché from the Wehrmacht has arrived in Bratislava, voicing frustration within the ranks of our military high command. Nominally, they have arrived to strengthen both of our militaries' fighting capabilities, although it is clear that they are nervous about the political beliefs and loyalties of our officers, fearing them not to be loyal enough to the Reich.\n\nThey have "suggested" the appointment [?SLO.high_command_selected_loc.GetName] within the Slovak high command, and have made clear that we can not expect the same levels of co-operation between our militaries if he is not appointed."
 slovakia.59.desc:0 "Following joint military exercises with [GER.GetNameDef], German high command claims to have found some "flaws" within our "doctrinal capabilities" and have suggested that we move [?SLO.high_command_selected_loc.GetName] further up the chain of command to remedy this.\n\nThis is all nonsense of course, not least because the Slovak army is flawless in ways their pathetic Teuton brains cannot even comprehend. No, it is clear that this demand is due to what the Reich sees as disloyal elements within our command, and yet, refusal is never an attractive option when in a room with the Germans."
 slovakia.59.a:0 "It is a reasonable request"
 slovakia.59.b:0 "These decisions will be made in Bratislava and Bratislava alone"
 
 slovakia.60.title:0 "German Industrialists Present Terms of Investment"
 slovakia.60.desc:0 "So far, our alliance with the Germans has given us great economic gains. New markets for our farmers, new investments into our arms factories, so far nothing to be too worried about as far as the government is concerned.\n\nToday, a delegation of German industrialists from an assortment of industries including representatives from Krupp, IG Farben and Volkswagen have arrived in Bratislava for a meeting with Mountain General and Minister of the Economy Gejza Medrický to discuss terms of future investments. Their promises are tempting - new jobs, fast growth, and an ever deepening hunger in the German market for Slovak goods and armaments.\n\nHowever, many of the terms they have demanded give the industrialists - and by proxy Berlin - large stakes and preferable treatment in key Slovak sectors and industries. To many, this level of cooperation seems less and less like the equal and mutually beneficial partnership it may have started as, and more like colonisation in all but name.\n\nDo we stand firm, reject their demands, or try to reach a compromise?"
 slovakia.60.a:0 "Anything for our new German friends"
 slovakia.60.a.tt:0 "$SLO_modify_the_slovak_economy_by$$MODIFIER_STABILITY_FACTOR$: §R-4.00%§!\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+5.00%§!"
 slovakia.60.b:0 "Some compromise is acceptable"
 slovakia.60.c:0 "We will put Slovak businesses and workers first!"
 
 slovakia.61.title:0 "Ethnic Clashes in Bratislava"
 slovakia.61.desc:0 "Following the collapse of the Austro-Hungarian empire, the capital Bratislava was left with a large Austro-German minority. Throughout the Czechoslovak period, relations between these ethnicities remained largely stable and cordial.\n\nHowever, the growing influence of [GER.GetNameDef] has seen many Slovaks view the German minority of Slovakia as a fifth column hostile to Slovakia. Today, the accused rape of a Slovak woman by an ethnic German man was all that was needed for hordes of angry mobs to begin attacking ethnic Germans in Bratislava, years of tensions boiling over in a wave of violence.\n\nThe situation is tense - our people view us with suspicion as we draw closer to Germany, and the regime of [GER.GetLeader] will not tolerate injustices towards German minorities in foreign countries, leaving us to make the tough choice between prioritising national unity and appeasing the Germans."
 slovakia.61.a:0 "Publicly denounce the violence as criminal and hooligan"
 slovakia.61.b:0 "Quietly arrest those involved and increase police presence in the streets"
 slovakia.61.c:0 "Remain neutral on the issue"
 slovakia.61.d:0 "Tacitly support the rioters"
 
 slovakia.62.title:0 "[GER.GetNameDefCap] Demands we Realign our Policies"
 slovakia.62.desc:0 "An envoy from Berlin has arrived in Bratislava today, making [GER.GetLeader]'s frustration at our policies that he says 'needlessly deviate from the joint goals of our nations'. It is clear that they will want to see us realign our policies to be closer to their interests, and are not in the mood for compromise or negotiations."
 slovakia.62.a:0 "If we must"
 slovakia.62.b:0 "They can go shove their Sauerkraut up their ass!"
 slovakia.62.b.tt:0 "\n§Y[GER.GetNameDefCap]§! are likely to try and §Rforcibly§! change our government if we refuse their demands."
 slovakia.61.d:0 "Tacitly support the rioters"
 
 slovakia.63.title:0 "[SLO.GetName] Refuses to Align with us"
 slovakia.63.desc:0 ""
 slovakia.63.a:0 "Who do they think they are?"
 slovakia.63.b:0 "There is nothing we can do"
 
 slovakia.64.title:0 "The Eagle Watches Closer"
 slovakia.64.desc:0 "After a chaotic few weeks, German control over Austria is absolute. This has now given us a border with the Reich, allowing them to extend their influence even further into our affairs."
 slovakia.64.a:0 "What could we possibly we do about it?"
 
 slovakia.65.title:0 "The Eagle Watches Closer"
 slovakia.65.desc:0 "Following the annexation of the Sudetenland, our position is even more vulnerable. Western democracies have proven themselves weak and unwilling to deal with [GER.GetLeader]'s Germany, seemingly leaving all nations of Central and Eastern Europe to the whims of Hitler and Stalin."
 slovakia.65.a:0 "What could we possibly we do about it?"

 slovakia_news.1.title:0 "The Slovak Rebellion Succeeds!"
 slovakia_news.1.desc:0 "After months of heavy fighting in Czechoslovakia, a masked man from the future has successfully put his forces in a position to dictate terms of surrender to the once proud Czechoslovak government in Prague. For the first time ever, Slovakia is to be an independent state, although though it's future, and perhaps the future of Europe and the world at large, is known only to one man..."
 slovakia_news.1.a:0 "What the?!!?"
 slovakia_news.1.b:0 "Sláva Horskému Generálovi!"
 slovakia_news.1.c:0 "One day, we will get it back."

 slovakia_news.2.title:0 "Mountain General destroys Hungary!"
 slovakia_news.2.desc:0 "In an incoherent and likely intoxicated state, Mountain General has announced the total destruction of the Hungarian state by nuclear hellfire! It would seem that over the past few years, the hermit state has been acquiring ultra-advanced nuclear capabilities, and has finally achieved them.\n\nThe world looks on with horror, as there is no telling what the madman will do next..."
 slovakia_news.2.a:0 "Oh God..."
 slovakia_news.2.b:0 "Based"

 slovakia_news.3.title:0 "Slovakia Invades Hungary"
 slovakia_news.3.desc:0 "In a move expected by many, the new Slovak regime has thrust southwards, seeking the conquest of Hungary. This comes after months of anti-Hungarian campaigns and actions by the government of [SLO.GetLeader], and the rapid militarisation of the Slovak state for war.\n\n[SLO.GetLeader] announced that his intentions were to put an end to the "descpicable and degenerate" Hungarian nation "once and for all". International ovservers have raised alarms about what may happen should Budapest come under Slovak control..."
 slovakia_news.3.a:0 "Gypsies fighting gypsies, what else is new?"
 slovakia_news.3.b:0 "The first of many conquests to come!"
 slovakia_news.3.c:0 "We will take back Northern Hungary!"

 slovakia_news.4.title:0 "Sanation Left Coup In Poland"
 slovakia_news.4.desc:0 "Following months of preparation, the leftist factions have overthrown the government of Ignacy Mościcki, promising to realise Marshall Piłsudski's original vision of a more democratic Poland. Current intelligence suggests [POL.GetLeader] may have had some help from [SLO.GetLeader]'s Slovakia in organising the coup."
 slovakia_news.4.a:0 "Intersting"
 slovakia_news.4.b:0 "We stand united"