 SLO_unclear_ideology_idea:0 "Unclear Ideology"
 SLO_unclear_ideology_idea_desc:0 "Despite his genius, Mountain General has been obfuscative on the specific ideological tenants of 'Mountain Generalism' so far. For now he does this to maintain a broad tent of support among the populous while the new Slovak government tries to stabilise itself, but we will have to figure out our nation's path at some point."
